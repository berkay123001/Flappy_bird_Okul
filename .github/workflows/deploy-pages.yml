# Blazor WASM uygulamasını GitHub Pages'e dağıtmak için basit bir iş akışı
name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ 001-web-tabanl-bas ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4
      - name: .NET Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Proje Bağımlılıklarını Yükle
        run: dotnet restore src/Client/Client.csproj
      - name: Projeyi Derle ve Yayınla
        run: dotnet publish src/Client/Client.csproj -c Release -o release --nologo /p:BasePath=/${{ github.event.repository.name }}
      
      - name: EKSİK index.html DOSYASINI MANUEL KOPYALA
        run: cp src/Client/wwwroot/index.html release/wwwroot/index.html

      - name: SPA yönlendirmeleri için 404.html ekle
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Dağıtım Dosyasını Yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/wwwroot
          
      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
