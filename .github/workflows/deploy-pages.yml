# Blazor WASM uygulamasını GitHub Pages'e dağıtmak için basit bir iş akışı
name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ 001-web-tabanl-bas ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4
      - name: .NET Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Proje Bağımlılıklarını Yükle
        run: dotnet restore src/Client/Client.csproj
      - name: Projeyi Derle ve Yayınla (BasePath'i otomatik ayarla)
        run: dotnet publish src/Client/Client.csproj -c Release -o publish --nologo /p:StaticWebAssetBasePath=/${{ github.event.repository.name }}

      - name: SPA yönlendirmeleri için 404.html ekle
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Dağıtım Dosyalarını Yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot
          
      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
