# Blazor WASM uygulamasını GitHub Pages'e dağıtmak için basit bir iş akışı
name: Deploy Blazor WASM to GitHub Pages

on:
  # 'main' branch'ine her push yapıldığında çalışır
  push:
   branches: [ 001-web-tabanl-bas ]
  
  # Actions sekmesinden manuel olarak da çalıştırmanı sağlar
  workflow_dispatch:

# GitHub Pages'in dağıtım yapmasına izin ver
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda sadece bir dağıtım yapılmasına izin ver
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v3
      - name: .NET Kurulumu
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x # Projenin .NET versiyonuyla eşleşmeli
      - name: Proje Bağımlılıklarını Yükle
        run: dotnet restore src/Client/Client.csproj
      - name: Projeyi Derle ve Yayınla
        # Repo adına göre base path'i otomatik ayarla
        run: dotnet publish src/Client/Client.csproj -c Release -o release --nologo /p:BasePath=/${{ github.event.repository.name }}
      - name: GitHub Pages için Yükleme Dosyasını Oluştur
        run: |
          cd release/wwwroot
          zip -r ../../deploy.zip .
      - name: Dağıtım Dosyasını Yükle
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./deploy.zip
      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v2
