# Blazor WASM uygulamasını GitHub Pages'e dağıtmak için basit bir iş akışı
name: Deploy Blazor WASM to GitHub Pages

on:
  # 'main' veya 001-web-tabanl-bas branch'ine her push yapıldığında çalışır
  push:
    branches: [ main, 001-web-tabanl-bas ]

  # Actions sekmesinden manuel olarak da çalıştırmanı sağlar
  workflow_dispatch:

# GitHub Pages'in dağıtım yapmasına izin ver
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda sadece bir dağıtım yapılmasına izin ver
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: .NET Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x # Projenin .NET versiyonuyla eşleşmeli

      - name: Projeyi Derle ve Yayınla
        run: dotnet publish src/Client/Client.csproj -c Release -o release --nologo /p:StaticWebAssetBasePath=/${{ github.event.repository.name }}

      - name: Base href'i repo yoluna göre güncelle
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"/${{ github.event.repository.name }}/\" />|" release/wwwroot/index.html

      - name: SPA 404 fallback oluştur
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Artefaktı Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
